[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm"
version = "0.1.0"
description = "Predictive maintenance on the AI4I 2020 schema: simulator, physics-based features, model comparison, evaluation report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Priyal Meena" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "joblib>=1.3",
]

[project.optional-dependencies]
download = ["requests>=2.31"]
dev = ["pytest>=7", "ruff>=0.4", "requests>=2.31"]

[project.scripts]
pdm = "pdm.cli:main"

[tool.setuptools.packages.find]
include = ["pdm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains models (a minute or so)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
